<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<title>AI 밀키트 놀이터</title>
<meta name="description" content="영상에 나온 앱·프롬프트, 설치 없이 바로 써 보세요.">
<meta property="og:title" content="AI 밀키트 놀이터">
<meta property="og:description" content="영상에 나온 앱·프롬프트, 설치 없이 바로 써 보세요.">
<style>
/* 위 탭 = 종류(앱·프롬프트·스킬…), 탭 안은 한 줄 = 하나. 앱은 왼쪽에 진짜 앱이 돌아가는 작은 화면 */
:root{--bg:#f5f4f0;--card:#fff;--ink:#1b1d21;--mute:#5f6570;--line:#e4e1da;--key:#e8590c;
--font:system-ui,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 56px}
h1{font-size:27px;line-height:1.25;margin:0 0 4px;letter-spacing:-.6px}
.lead{color:var(--mute);margin:0 0 16px;word-break:keep-all}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px 14px;padding:10px 16px 0;background:var(--bg)}
.find{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.find:focus-within{border-color:var(--ink)}
.find input{flex:1;min-width:0;border:0;outline:0;background:none;font:16px var(--font);color:var(--ink);padding:11px 0}
.find button{border:0;background:none;font:700 20px var(--font);color:var(--mute);cursor:pointer;padding:0 2px;line-height:1}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 15px var(--font);padding:8px 15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button small{font-weight:600;opacity:.6;margin-left:3px}
.head{margin:2px 0 12px;word-break:keep-all}
.head b{display:block;font-size:19px;letter-spacing:-.4px}
.head span{color:var(--mute);font-size:14px}
/* 글자 크게(폰 글꼴 크기·인스타 안 브라우저) = 글 칸이 9em 보다 좁아지면 미리보기 밑으로 내려감 */
.app{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.screen{flex:none;position:relative;display:block;width:132px;height:286px;border-radius:14px;overflow:hidden;background:#111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.screen iframe{position:absolute;left:0;top:0;width:360px;height:780px;border:0;transform:scale(.3667);transform-origin:0 0;pointer-events:none}
.num{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:1px 7px;margin:0 6px 6px 0;font:800 13px/1.5 ui-monospace,Consolas,var(--font);letter-spacing:.5px}
.doc .num{color:#fff;font-size:13px}
.doc b{display:block}
.find input::-webkit-search-cancel-button{display:none}
.doc>div{flex:1;min-width:0}
.screen .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff8;font-size:13px}
.app>div{flex:1 1 9em;min-width:0;word-break:keep-all}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--key);margin:0 0 2px}
.app h3{font-size:19px;line-height:1.3;margin:0 0 4px;letter-spacing:-.4px}
.app p{margin:0 0 12px;color:var(--mute);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.go,.share{border:0;border-radius:999px;font:700 14px var(--font);padding:8px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.go{background:var(--key);color:#fff}
.share{background:var(--bg);color:var(--ink)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 10px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06);word-break:keep-all}
.doc b{display:block;font-size:16px}
.doc span{color:var(--mute);font-size:14px}
.doc .rk{font-style:normal;color:var(--key);margin-right:6px}
.doc i{font-style:normal;color:var(--key);font-weight:800;white-space:nowrap}
.empty{color:var(--mute);padding:20px 4px}
.go:focus-visible,.share:focus-visible,.screen:focus-visible,.doc:focus-visible,.tabs button:focus-visible{outline:2px solid var(--key);outline-offset:2px}
footer{margin-top:34px;text-align:center;color:#8a909b;font-size:14px}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b1d21;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>놀이터</h1>
  <p class="lead">영상에 나온 그거, 여기 다 있어요. 설치 없이 무료.</p>
  <div class="bar">
    <label class="find"><span aria-hidden="true">🔍</span><input id="q" type="search" inputmode="search" placeholder="번호나 이름으로 찾기 (예: 003, 잉어)" aria-label="번호나 이름으로 찾기" autocomplete="off"><button type="button" id="qx" aria-label="지우기" hidden>×</button></label>
    <nav class="tabs" role="tablist" id="tabs" aria-label="종류"></nav>
  </div>
  <section id="panel" role="tabpanel"></section>
  <footer>만든 곳 · <a href="https://www.instagram.com/ai_mealkit/">인스타 @ai_mealkit</a> · <a href="https://www.youtube.com/@ai_mealkit">유튜브</a></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/count.js"></script>
<script>
(() => {
  // ── 여기만 고치면 된다 ──────────────────────────────────────────────
  // 탭: 항목이 하나도 없는 탭은 안 보인다. 첫 화면 = 전체(올린 순서, 새 것 먼저). 주소 끝 #popular·#apps·#prompts 로 그 탭이 바로 열린다.
  const TABS = [
    { id: "all", label: "전체", head: "새로 올린 순서", sub: "영상 설명에 적힌 번호로 찾으면 돼요." },
    { id: "popular", label: "인기", head: "많이 연 순서", sub: "사람들이 많이 연 순서대로 모았어요." },
    { id: "guides", label: "자료실", head: "영상 따라 하기 자료", sub: "영상에서 한 그대로 — 순서·실제 화면·복사 문장·이렇게 되면 성공까지." },
    { id: "apps", label: "앱", head: "딸깍 앱", sub: "말 한마디로 딸깍 만든 앱. 눌러서 바로 써 보세요." },
    { id: "prompts", label: "프롬프트", head: "영상에서 본 그 문장", sub: "복사해서 AI 채팅창에 붙여 넣기만 하면 돼요." },
    { id: "skills", label: "스킬", head: "클로드 스킬", sub: "받아서 넣으면 클로드가 그 일을 알아서 해요." },
  ];
  // 인기 = 구글 시트 「인기」 탭을 웹에 게시한 CSV — 페이지 이름만 많이 연 순서로(사람 수는 공개 안 함, 브라우저마다 하루 1번만 셈). 비워 두거나 못 읽으면 인기 탭은 안 보인다.
  const POP_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS68WJqxlHTbeVJ19CZiNRiwgh-e3xpwKwUXDc5Pt-BLTtbSkxhrp9Zn9fqLUStEW8py_DXp_UQtUQL/pub?gid=1695152522&single=true&output=csv";
  const SERIES = "딸깍 앱";   // 카드 꼬리표 = 영상 시리즈 이름만(11-03 대표님 1-A) — 「딸깍 앱 #N」, N = 영상 꼬리표 번호(no). 시리즈가 아닌 것은 꼬리표 없이 번호만
  // 항목: id = 놀이터 번호(올린 순서, 한 번 붙이면 안 바꿈 — 영상 설명란 「놀이터 N번」). 새 것은 맨 위에 다음 번호로 한 줄. tab = 위 TABS 의 id
  const ITEMS = [
    { id: 10, tab: "guides", slug: "gemini", name: "제미나이 무료 계정으로 되는 것 10가지", line: "결제 0원 그대로 — 포스터·계약서·영수증·유튜브 요약·그림책, 문장 10개와 무료/유료 정리표" },
    { id: 9, tab: "guides", slug: "motion", name: "무료 클로드·제미나이로 모션그래픽 만들기", line: "문장 8개 그대로 복사 — 로고·그래프·쇼츠 인트로·가게 TV, mp4 저장법까지" },
    { id: 8, tab: "guides", slug: "mcp", name: "클로드 무료 계정에 캘린더·메일·카톡 연결", line: "MCP 커넥터 — 누를 곳·허용할 것·복사 문장·막힐 때" },
    { id: 7, tab: "guides", slug: "work7", name: "AI에 맡겨 볼 업무 7가지", line: "무료 계정으로 직접 해 본 7가지 — 순서·화면·복사 문장 14개" },
    { id: 6, tab: "prompts", slug: "photo", name: "폰 사진 한 장 → 광고 사진", line: "사진 올리고 붙여 넣을 문장 5개" },
    { id: 5, tab: "apps", slug: "timer", name: "회의 돈 타이머", line: "인원·연봉만 넣으면 이 회의에 1분마다 얼마가 나가는지." },
    { id: 4, tab: "prompts", slug: "reply", name: "거절 티 안 나는 직장 답장", line: "받은 카톡을 붙이면 답장 3개" },
    { id: 3, tab: "apps", no: 3, slug: "koi-pond", name: "손끝 잉어 연못", line: "손가락을 대면 잉어가 졸졸 따라와요. 톡 치면 먹이." },
    { id: 2, tab: "apps", no: 2, slug: "meeting-escape", name: "회의 탈출 버튼", line: "전화 걸 사람을 고르면 진짜처럼 전화가 와요(가짜 화면)." },
    { id: 1, tab: "apps", no: 1, slug: "weekend-battery", name: "주말 배터리", line: "금요일 18시 100%, 월요일 아침 0%. 내 주말은 몇 % 남았지?" },
  ];
  // ────────────────────────────────────────────────────────────────

  const $ = id => document.getElementById(id);
  const count = (ev, p) => window.mkCount && window.mkCount(ev, p);
  const newest = (a, b) => b.id - a.id;
  let pop = null;   // { slug: 점수 } — 인기 순서를 받았을 때만
  const inTab = id => id === "all" ? ITEMS.slice().sort(newest)
    : id === "popular" ? ITEMS.filter(i => pop[i.slug] > 0).sort((a, b) => pop[b.slug] - pop[a.slug] || newest(a, b))
    : ITEMS.filter(i => i.tab === id).sort(newest);
  let tabs = [], cur = null, io = null;
  function drawTabs() {
    tabs = TABS.filter(t => (t.id === "popular" ? pop !== null : true) && inTab(t.id).length);
    $("tabs").innerHTML = tabs.map(t =>
      `<button role="tab" id="t-${t.id}" data-tab="${t.id}" aria-controls="panel">${t.label}${t.id === "popular" ? "" : `<small>${inTab(t.id).length}</small>`}</button>`).join("");
  }

  const no3 = n => String(n).padStart(3, "0");   // 001 · 002 …
  const num = i => `<span class="num" aria-label="${i.id}번">${no3(i.id)}</span>`;
  function appCard(a, rank) {
    const url = "/" + a.slug + "/";
    const tag = (rank ? "인기 " + rank + "위 · " : "") + (a.no ? `${SERIES} #${a.no}` : (a.tag || ""));
    return `<article class="app"><a class="screen" href="${url}" data-slug="${a.slug}" aria-label="${a.id}번 ${a.name} 열기"><span class="ph">불러오는 중…</span></a>` +
      `<div>${num(a)}${tag ? `<span class="tag">${tag}</span>` : ""}<h3>${a.name}</h3><p>${a.line}</p><div class="btns">` +
      `<a class="go" href="${url}" data-slug="${a.slug}">바로 해 보기</a>` +
      `<button class="share" type="button" data-slug="${a.slug}" data-name="${a.name}">친구한테 보내기</button></div></div></article>`;
  }
  const docRow = (d, rank) => `<a class="doc" href="/${d.slug}/" data-slug="${d.slug}"><div>${num(d)}<b>${rank ? `<em class="rk">인기 ${rank}위</em>` : ""}${d.name}</b><span>${d.line}</span></div><i>열기 →</i></a>`;
  const card = (i, rank) => i.tab === "apps" ? appCard(i, rank) : docRow(i, rank);

  function show(id, user) {
    const t = tabs.find(x => x.id === id) || tabs[0];
    cur = t.id;
    tabs.forEach(x => $("t-" + x.id).setAttribute("aria-selected", String(x.id === t.id)));
    const list = inTab(t.id), rk = t.id === "popular";
    $("panel").setAttribute("aria-labelledby", "t-" + t.id);
    $("panel").innerHTML = `<div class="head"><b>${t.head}</b><span>${t.sub}</span></div>` + list.map((i, k) => card(i, rk && k + 1)).join("");
    wire();
    if (user) { history.replaceState(null, "", "#" + t.id); count("tab", t.id); }
  }

  // 검색: 번호(「3」·「3번」)는 그 번호 하나, 글자는 이름·설명에 들어 있는 것 전부(새 것 먼저). 지우면 보던 탭으로.
  function find(raw) {
    const q = raw.trim().toLowerCase();
    $("qx").hidden = !q;
    if (!q) return show(cur, false);
    const n = q.replace(/\s|번|#|no\.?/g, "");
    const list = /^\d+$/.test(n) ? ITEMS.filter(i => i.id === +n)
      : ITEMS.filter(i => (i.name + " " + i.line + " " + (i.no ? SERIES + " #" + i.no : "") + " " + (i.tag || "")).toLowerCase().includes(q)).sort(newest);
    tabs.forEach(x => $("t-" + x.id).setAttribute("aria-selected", "false"));
    $("panel").removeAttribute("aria-labelledby");
    $("panel").innerHTML = `<div class="head"><b>찾은 것 ${list.length}개</b><span>「${raw.trim().replace(/[<>&"]/g, "")}」</span></div>` +
      (list.length ? list.map(i => card(i)).join("") : `<p class="empty">없어요. 번호나 다른 낱말로 찾아보세요.</p>`);
    wire();
  }
  let qt = null;
  $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => find(e.target.value), 120); });
  $("q").addEventListener("change", e => { if (e.target.value.trim()) count("find", e.target.value.trim().slice(0, 20)); });
  $("qx").addEventListener("click", () => { $("q").value = ""; find(""); $("q").focus(); });

  function wire() {
    if (io) io.disconnect();
    // 미리보기: 화면에 보일 때만 진짜 앱을 띄우고, 벗어나면 내린다(폰이 무거워지지 않게)
    io = new IntersectionObserver(es => es.forEach(e => {
      const s = e.target, f = s.querySelector("iframe");
      if (e.isIntersecting && !f) {
        const fr = document.createElement("iframe");
        fr.src = "/" + s.dataset.slug + "/"; fr.title = ""; fr.tabIndex = -1; fr.setAttribute("aria-hidden", "true");
        fr.onload = () => { const ph = s.querySelector(".ph"); if (ph) ph.remove(); };
        s.appendChild(fr);
      } else if (!e.isIntersecting && f) { f.remove(); if (!s.querySelector(".ph")) s.insertAdjacentHTML("beforeend", '<span class="ph">…</span>'); }
    }), { rootMargin: "120px" });
    document.querySelectorAll(".screen").forEach(s => io.observe(s));
    document.querySelectorAll("#panel a[data-slug]").forEach(a => a.addEventListener("click", () => count("open", a.dataset.slug)));
    document.querySelectorAll("#panel .share").forEach(b => b.addEventListener("click", async () => {
      const url = location.origin + "/" + b.dataset.slug + "/";
      count("share", b.dataset.slug);
      try {
        if (navigator.share) { await navigator.share({ title: b.dataset.name, text: b.dataset.name + " — 설치 없이 바로 써 보기", url }); return; }
        await navigator.clipboard.writeText(url); toast("주소를 복사했어요");
      } catch (e) { if (e && e.name !== "AbortError") toast(url); }
    }));
  }
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1600); };

  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    if ($("q").value) { $("q").value = ""; $("qx").hidden = true; }
    show(b.dataset.tab, true);
  });
  $("tabs").addEventListener("keydown", e => {   // 좌우 화살표로 탭 이동
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = Math.max(0, tabs.findIndex(t => t.id === cur));
    const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    show(n.id, true); $("t-" + n.id).focus();
  });

  // 첫 화면은 바로 그림(전체). 인기 순서가 오면 탭만 하나 더 생김(#popular 로 들어온 사람은 그때 인기 탭으로)
  drawTabs(); show(location.hash.slice(1), false);
  if (POP_CSV) fetch(POP_CSV, { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(txt => {
    const m = {}, rows = txt.trim().split(/\r?\n/).slice(1).map(l => l.split(",")[0].trim()).filter(Boolean);
    rows.forEach((p, k) => { m[p] = rows.length - k; });   // 위에 있을수록 큰 점수(순서만 받음)
    if (!Object.keys(m).length) return;
    pop = m; drawTabs();
    const want = location.hash.slice(1) === "popular" && !$("q").value ? "popular" : cur;
    if ($("q").value) { find($("q").value); } else show(want, false);
  }).catch(() => {});
})();
</script>
</body>
</html>
