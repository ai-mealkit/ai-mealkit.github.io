<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<title>AI 밀키트 놀이터</title>
<meta name="description" content="영상에 나온 앱·프롬프트, 설치 없이 바로 써 보세요.">
<meta property="og:title" content="AI 밀키트 놀이터">
<meta property="og:description" content="영상에 나온 앱·프롬프트, 설치 없이 바로 써 보세요.">
<style>
/* 위 탭 = 종류(앱·프롬프트·스킬…), 탭 안은 한 줄 = 하나. 앱은 왼쪽에 진짜 앱이 돌아가는 작은 화면 */
:root{--bg:#f5f4f0;--card:#fff;--ink:#1b1d21;--mute:#5f6570;--line:#e4e1da;--key:#e8590c;
--font:system-ui,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 56px}
h1{font-size:27px;line-height:1.25;margin:0 0 4px;letter-spacing:-.6px}
.lead{color:var(--mute);margin:0 0 16px;word-break:keep-all}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:10px 16px;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 15px var(--font);padding:8px 15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button small{font-weight:600;opacity:.6;margin-left:3px}
.head{margin:2px 0 12px;word-break:keep-all}
.head b{display:block;font-size:19px;letter-spacing:-.4px}
.head span{color:var(--mute);font-size:14px}
/* 글자 크게(폰 글꼴 크기·인스타 안 브라우저) = 글 칸이 9em 보다 좁아지면 미리보기 밑으로 내려감 */
.app{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.screen{flex:none;position:relative;display:block;width:132px;height:286px;border-radius:14px;overflow:hidden;background:#111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.screen iframe{position:absolute;left:0;top:0;width:360px;height:780px;border:0;transform:scale(.3667);transform-origin:0 0;pointer-events:none}
.screen .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff8;font-size:13px}
.app>div{flex:1 1 9em;min-width:0;word-break:keep-all}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--key);margin:0 0 2px}
.app h3{font-size:19px;line-height:1.3;margin:0 0 4px;letter-spacing:-.4px}
.app p{margin:0 0 12px;color:var(--mute);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.go,.share{border:0;border-radius:999px;font:700 14px var(--font);padding:8px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.go{background:var(--key);color:#fff}
.share{background:var(--bg);color:var(--ink)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 10px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06);word-break:keep-all}
.doc b{display:block;font-size:16px}
.doc span{color:var(--mute);font-size:14px}
.doc i{font-style:normal;color:var(--key);font-weight:800;white-space:nowrap}
.go:focus-visible,.share:focus-visible,.screen:focus-visible,.doc:focus-visible,.tabs button:focus-visible{outline:2px solid var(--key);outline-offset:2px}
footer{margin-top:34px;text-align:center;color:#8a909b;font-size:14px}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b1d21;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>놀이터</h1>
  <p class="lead">영상에 나온 그거, 여기 다 있어요. 설치 없이 무료.</p>
  <nav class="tabs" role="tablist" id="tabs" aria-label="종류"></nav>
  <section id="panel" role="tabpanel"></section>
  <footer>만든 곳 · <a href="https://www.instagram.com/ai_mealkit/">인스타 @ai_mealkit</a> · <a href="https://www.youtube.com/@ai_mealkit">유튜브</a></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/count.js"></script>
<script>
(() => {
  // ── 여기만 고치면 된다 ──────────────────────────────────────────────
  // 탭: 항목이 하나도 없는 탭은 안 보인다(준비 안 된 자료는 미리 약속하지 않음). 주소 끝 #apps·#prompts 로 그 탭이 바로 열린다.
  const TABS = [
    { id: "apps", label: "앱", head: "딸깍 앱", sub: "말 한마디로 딸깍 만든 앱. 눌러서 바로 써 보세요." },
    { id: "prompts", label: "프롬프트", head: "영상에서 본 그 문장", sub: "복사해서 AI 채팅창에 붙여 넣기만 하면 돼요." },
    { id: "skills", label: "스킬", head: "클로드 스킬", sub: "받아서 넣으면 클로드가 그 일을 알아서 해요." },
  ];
  const SERIES = "딸깍 앱";   // 앱 카드 꼬리표 「딸깍 앱 #N」 — N = 영상 꼬리표 번호
  // 항목: 새로 만든 것은 그 탭의 맨 위에 한 줄. tab = 위 TABS 의 id
  const ITEMS = [
    { tab: "apps", no: 3, slug: "koi-pond", name: "손끝 잉어 연못", line: "손가락을 대면 잉어가 졸졸 따라와요. 톡 치면 먹이." },
    { tab: "apps", no: 2, slug: "meeting-escape", name: "회의 탈출 버튼", line: "전화 걸 사람을 고르면 진짜처럼 전화가 와요(가짜 화면)." },
    { tab: "apps", no: 1, slug: "weekend-battery", name: "주말 배터리", line: "금요일 18시 100%, 월요일 아침 0%. 내 주말은 몇 % 남았지?" },
    { tab: "apps", tag: "직장인 도구", slug: "timer", name: "회의 돈 타이머", line: "인원·연봉만 넣으면 이 회의에 1분마다 얼마가 나가는지." },
    { tab: "prompts", slug: "reply", name: "거절 티 안 나는 직장 답장", line: "받은 카톡을 붙이면 답장 3개" },
    { tab: "prompts", slug: "photo", name: "폰 사진 한 장 → 광고 사진", line: "사진 올리고 붙여 넣을 문장 5개" },
  ];
  // ────────────────────────────────────────────────────────────────

  const $ = id => document.getElementById(id);
  const count = (ev, p) => window.mkCount && window.mkCount(ev, p);
  const tabs = TABS.filter(t => ITEMS.some(i => i.tab === t.id));
  let io = null;

  $("tabs").innerHTML = tabs.map(t =>
    `<button role="tab" id="t-${t.id}" data-tab="${t.id}" aria-controls="panel">${t.label}<small>${ITEMS.filter(i => i.tab === t.id).length}</small></button>`).join("");

  function appCard(a) {
    const url = "/" + a.slug + "/";
    const tag = a.no ? `${SERIES} #${a.no}` : (a.tag || "");
    return `<article class="app"><a class="screen" href="${url}" data-slug="${a.slug}" aria-label="${a.name} 열기"><span class="ph">불러오는 중…</span></a>` +
      `<div>${tag ? `<span class="tag">${tag}</span>` : ""}<h3>${a.name}</h3><p>${a.line}</p><div class="btns">` +
      `<a class="go" href="${url}" data-slug="${a.slug}">바로 해 보기</a>` +
      `<button class="share" type="button" data-slug="${a.slug}" data-name="${a.name}">친구한테 보내기</button></div></div></article>`;
  }
  const docRow = d => `<a class="doc" href="/${d.slug}/" data-slug="${d.slug}"><div><b>${d.name}</b><span>${d.line}</span></div><i>열기 →</i></a>`;

  function show(id, user) {
    const t = tabs.find(x => x.id === id) || tabs[0];
    tabs.forEach(x => $("t-" + x.id).setAttribute("aria-selected", String(x.id === t.id)));
    const list = ITEMS.filter(i => i.tab === t.id);
    $("panel").setAttribute("aria-labelledby", "t-" + t.id);
    $("panel").innerHTML = `<div class="head"><b>${t.head}</b><span>${t.sub}</span></div>` +
      list.map(i => (t.id === "apps" ? appCard(i) : docRow(i))).join("");
    wire();
    if (user) { history.replaceState(null, "", "#" + t.id); count("tab", t.id); }
  }

  function wire() {
    if (io) io.disconnect();
    // 미리보기: 화면에 보일 때만 진짜 앱을 띄우고, 벗어나면 내린다(폰이 무거워지지 않게)
    io = new IntersectionObserver(es => es.forEach(e => {
      const s = e.target, f = s.querySelector("iframe");
      if (e.isIntersecting && !f) {
        const fr = document.createElement("iframe");
        fr.src = "/" + s.dataset.slug + "/"; fr.title = ""; fr.tabIndex = -1; fr.setAttribute("aria-hidden", "true");
        fr.onload = () => { const ph = s.querySelector(".ph"); if (ph) ph.remove(); };
        s.appendChild(fr);
      } else if (!e.isIntersecting && f) { f.remove(); if (!s.querySelector(".ph")) s.insertAdjacentHTML("afterbegin", '<span class="ph">…</span>'); }
    }), { rootMargin: "120px" });
    document.querySelectorAll(".screen").forEach(s => io.observe(s));
    document.querySelectorAll("#panel a[data-slug]").forEach(a => a.addEventListener("click", () => count("open", a.dataset.slug)));
    document.querySelectorAll("#panel .share").forEach(b => b.addEventListener("click", async () => {
      const url = location.origin + "/" + b.dataset.slug + "/";
      count("share", b.dataset.slug);
      try {
        if (navigator.share) { await navigator.share({ title: b.dataset.name, text: b.dataset.name + " — 설치 없이 바로 써 보기", url }); return; }
        await navigator.clipboard.writeText(url); toast("주소를 복사했어요");
      } catch (e) { if (e && e.name !== "AbortError") toast(url); }
    }));
  }
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1600); };

  $("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab, true); });
  $("tabs").addEventListener("keydown", e => {   // 좌우 화살표로 탭 이동
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = tabs.findIndex(t => $("t-" + t.id).getAttribute("aria-selected") === "true");
    const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    show(n.id, true); $("t-" + n.id).focus();
  });
  show(location.hash.slice(1), false);
})();
</script>
</body>
</html>
